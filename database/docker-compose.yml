# Selects the Compose file format used to interpret this configuration.
version: '3.8'

# Begins the list of application services that Compose can run.
services:
  # Names the PostgreSQL service so other Compose settings can refer to it.
  postgres:
    # Chooses the container image that provides this service.
    image: postgres:16-alpine
    # Gives the container a predictable local name.
    container_name: forgeos_postgres
    # Controls whether Docker restarts the container after it stops.
    restart: unless-stopped
    # Supplies configuration values to the running container.
    environment:
      # Sets the POSTGRES_DB value used by the surrounding configuration.
      POSTGRES_DB: forgeos_db
      # Sets the POSTGRES_USER value used by the surrounding configuration.
      POSTGRES_USER: forgeos_user
      # Sets the POSTGRES_PASSWORD value used by the surrounding configuration.
      POSTGRES_PASSWORD: forgeos_secure_password
      # Sets the PGDATA value used by the surrounding configuration.
      PGDATA: /var/lib/postgresql/data/pgdata
    # Publishes container ports so local applications can connect.
    ports:
      # Adds one entry to the list configured by the surrounding key.
      - '5432:5432'
    # Connects persistent data or local files to the container.
    volumes:
      # Adds one entry to the list configured by the surrounding key.
      - pgdata:/var/lib/postgresql/data
      # Entrypoint scripts are executed alphabetically on initial database creation
      # Adds one entry to the list configured by the surrounding key.
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      # Adds one entry to the list configured by the surrounding key.
      - ./seeds/0001_seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    # Defines how Compose determines whether the service is ready.
    healthcheck:
      # Runs the command used to check service health.
      test: ['CMD-SHELL', 'pg_isready -U forgeos_user -d forgeos_db']
      # Sets how often the health check is repeated.
      interval: 5s
      # Limits how long one health check may take.
      timeout: 5s
      # Sets how many failed checks are allowed before marking the service unhealthy.
      retries: 5

# Connects persistent data or local files to the container.
volumes:
  # Sets the pgdata value used by the surrounding configuration.
  pgdata:
    # Selects the storage driver used by this named volume.
    driver: local
